# Weekly: collect postings, rebuild the dashboard, commit it, and publish the site.
# The SQLite history (data/lens.db) holds the full text of every posting, so it is kept out of this
# repo: it lives as an asset of a release named "data" in the private repo DATA_REPO, read and
# written with the DATA_REPO_TOKEN secret.
name: Collect and publish

on:
  schedule:
    # Backup only. The Cloudflare Worker's cron starts this workflow on Mondays at 2:17 a.m. New York time
    # (lib/start_collection.js), because GitHub's own schedule can start hours late. This backup at 10:17 UTC
    # (6:17 or 5:17 a.m. New York) skips itself when a run in the last 20 hours succeeded or is still running.
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: "Max postings per company (blank = config default)"
        required: false
      only:
        description: "Only these tickers, comma-separated (blank = all companies)"
        required: false
      build_only:
        description: "Skip collection and rebuild from the saved history (after a run failed past Collect)"
        type: boolean
        default: false

env:
  DATA_REPO: yimizhao2015/jobmarket-lens-data

permissions:
  contents: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?created=%3E%3D$since&per_page=20" \
                  --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and (.status != "completed" or .conclusion == "success"))] | length' || echo 0)
            [ "${n:-0}" -gt 0 ] && go=false && echo "A run since $since succeeded or is running; backup skipped."
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # A few career sites list their jobs only in a real browser (collector/adapters/browser.py).
      - run: python -m playwright install --with-deps chromium
      - name: Restore history
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # Without the private history the run would forget when postings were first seen.
          [ -n "$GH_TOKEN" ] || { echo "::error::DATA_REPO_TOKEN secret is not set"; exit 1; }
          # The history is saved as lens.db.xz (about half the size of gzip). lens.db.gz is the format used
          # before Nov 30, 2026, and the seed is the starting history committed to the data repo in parts.
          if gh release download data -R "$DATA_REPO" -p lens.db.xz -D data; then
            xz -d -T0 -f data/lens.db.xz
          elif gh release download data -R "$DATA_REPO" -p lens.db.gz -D data; then
            gunzip -f data/lens.db.gz
          else
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${DATA_REPO}" seed-repo
            cat seed-repo/seed/lens.db.gz.part-* | gunzip > data/lens.db
            rm -rf seed-repo
          fi
          # The build's cache of text results (scripts/build_dataset.py); without it the build reads every posting.
          gh release download data -R "$DATA_REPO" -p norm_cache.db.gz -D data && gunzip -f data/norm_cache.db.gz || true
      - name: Collect
        if: ${{ !inputs.build_only }}
        # WEB_BOT_AUTH_KEY signs each request (Web Bot Auth, collector/bot_auth.py); unset means unsigned.
        env:
          WEB_BOT_AUTH_KEY: ${{ secrets.WEB_BOT_AUTH_KEY }}
        # The 200-minute budget leaves room for the build (about 2 hours by late Nov 2026, and growing with the
        # history) within the job's 350-minute limit.
        run: >-
          python -m collector.run --minutes 200
          ${{ github.event.inputs.max && format('--max {0}', github.event.inputs.max) || '' }}
          ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      # Saved before the build, so a failure later in the run doesn't lose the week's collection
      # (rerun with build_only to finish it).
      - name: Save collected history
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          xz -kf -T0 -6 data/lens.db
          gh release upload data -R "$DATA_REPO" data/lens.db.xz --clobber
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Save history
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # The build only reads lens.db, so the copy compressed after collecting is reused when there is one.
          [ -f data/lens.db.xz ] || xz -kf -T0 -6 data/lens.db
          gzip -kf data/normalized/postings.csv data/norm_cache.db
          gh release view data -R "$DATA_REPO" >/dev/null 2>&1 || gh release create data -R "$DATA_REPO" --title "Posting history" --notes "SQLite history (lens.db.xz) and normalized postings (postings.csv.gz) for JobMarket Lens. Replaced on every weekly run."
          gh release upload data -R "$DATA_REPO" data/lens.db.xz data/normalized/postings.csv.gz data/norm_cache.db.gz --clobber
          # The old gzip copy of the history, once the xz copy is saved.
          gh release delete-asset data lens.db.gz -R "$DATA_REPO" -y 2>/dev/null || true
          # Source coverage (each company's collection status) and Collection status by week are committed to the
          # data repo through the contents API (no clone of the large seed files). A failure here only warns, so
          # the dashboard below is still published.
          save() {  # save <local file> <path in the data repo>
            path=$(jq -rn --arg p "$2" '$p|@uri')
            sha=$(gh api "repos/$DATA_REPO/contents/$path" --jq .sha 2>/dev/null || true)
            base64 -w0 "$1" > /tmp/file.b64
            jq -n --rawfile c /tmp/file.b64 --arg m "$2 $(date -u +%F)" --arg sha "$sha" \
              '{message: $m, content: $c} + (if $sha == "" then {} else {sha: $sha} end)' > /tmp/file.json
            gh api -X PUT "repos/$DATA_REPO/contents/$path" --input /tmp/file.json >/dev/null \
              || echo "::warning::Could not save $2 to $DATA_REPO"
          }
          save "data/data source.csv" "Source coverage.csv"
          save "data/collection status by week.csv" "Collection status by week.csv"
      - name: Commit dashboard
        run: |
          git config user.name "jobmarket-lens bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- web/index.html web/postings web/downloads config/
          git commit -m "Data refresh $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase -X theirs origin main
          git push
