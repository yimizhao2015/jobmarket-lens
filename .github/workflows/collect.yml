# Weekly: collect postings, rebuild the dashboard, commit it, and publish the site.
# The SQLite history (data/lens.db) holds the full text of every posting, and the paid zips are
# for sale, so both are kept out of this repo: they live as assets of a release named "data" in
# the private repo DATA_REPO, read and written with the DATA_REPO_TOKEN secret.
name: Collect and publish

on:
  schedule:
    # Backup only. The Cloudflare Worker's cron starts this workflow on Mondays at 2:17 a.m. New York time
    # (lib/start_collection.js), because GitHub's own schedule can start hours late. This backup at 10:17 UTC
    # (6:17 or 5:17 a.m. New York) skips itself when a run in the last 20 hours succeeded or is still running.
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: "Max postings per company (blank = config default)"
        required: false
      only:
        description: "Only these tickers, comma-separated (blank = all companies)"
        required: false
      build_only:
        description: "Skip collection and rebuild from the saved history (after a run failed past Collect)"
        type: boolean
        default: false

env:
  DATA_REPO: yimizhao2015/jobmarket-lens-data

permissions:
  contents: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?created=%3E%3D$since&per_page=20" \
                  --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and (.status != "completed" or .conclusion == "success"))] | length' || echo 0)
            [ "${n:-0}" -gt 0 ] && go=false && echo "A run since $since succeeded or is running; backup skipped."
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # A few career sites list their jobs only in a real browser (collector/adapters/browser.py).
      - run: python -m playwright install --with-deps chromium
      - name: Restore history
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # Without the private history the run would forget when postings were first seen.
          [ -n "$GH_TOKEN" ] || { echo "::error::DATA_REPO_TOKEN secret is not set"; exit 1; }
          if ! gh release download data -R "$DATA_REPO" -p lens.db.gz -D data; then
            # First run: start from the seed history committed to the data repo in parts.
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${DATA_REPO}" seed-repo
            cat seed-repo/seed/lens.db.gz.part-* > data/lens.db.gz
            rm -rf seed-repo
          fi
          gunzip -f data/lens.db.gz
      - name: Collect
        if: ${{ !inputs.build_only }}
        run: >-
          python -m collector.run
          ${{ github.event.inputs.max && format('--max {0}', github.event.inputs.max) || '' }}
          ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
      # Saved before the build, so a failure later in the run doesn't lose the week's collection
      # (rerun with build_only to finish it).
      - name: Save collected history
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          gzip -kf data/lens.db
          gh release upload data -R "$DATA_REPO" data/lens.db.gz --clobber
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Save history
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          gzip -kf data/lens.db data/normalized/postings.csv
          gh release view data -R "$DATA_REPO" >/dev/null 2>&1 || gh release create data -R "$DATA_REPO" --title "Posting history" --notes "SQLite history (lens.db.gz) and normalized postings (postings.csv.gz) for JobMarket Lens. Replaced on every weekly run."
          gh release upload data -R "$DATA_REPO" data/lens.db.gz data/normalized/postings.csv.gz --clobber
          # Paid downloads (Get the Data page): replaced every week
          gh release upload data -R "$DATA_REPO" "data/products/jobmarketlens-latest-week.zip" "data/products/jobmarketlens-full-archive.zip" --clobber
          # Source coverage (each company's collection status) is kept out of the zips; commit it to the data
          # repo through the contents API (no clone of the large seed files). A failure here only warns, so the
          # dashboard below is still published.
          path="Source%20coverage.csv"
          sha=$(gh api "repos/$DATA_REPO/contents/$path" --jq .sha 2>/dev/null || true)
          base64 -w0 "data/data source.csv" > /tmp/cov.b64
          jq -n --rawfile c /tmp/cov.b64 --arg m "Source coverage $(date -u +%F)" --arg sha "$sha" \
            '{message: $m, content: $c} + (if $sha == "" then {} else {sha: $sha} end)' > /tmp/cov.json
          gh api -X PUT "repos/$DATA_REPO/contents/$path" --input /tmp/cov.json >/dev/null \
            || echo "::warning::Could not save Source coverage.csv to $DATA_REPO"
      - name: Commit dashboard
        run: |
          git config user.name "jobmarket-lens bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- web/index.html web/postings web/downloads config/
          git commit -m "Data refresh $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase -X theirs origin main
          git push
