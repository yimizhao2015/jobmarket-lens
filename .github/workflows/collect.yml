# Weekly: collect postings, rebuild the dashboard, commit it, and publish the site.
# The SQLite history (data/lens.db) holds the full text of every posting, so it is kept out of
# this public repo: it lives as the asset of a release named "data" in the private repo
# DATA_REPO, read and written with the DATA_REPO_TOKEN secret, and restored before each run.
name: Collect and publish

on:
  schedule:
    # Mondays 2:00 a.m. New York time. GitHub schedules in UTC, so 06:00 UTC (2 a.m. EDT) and
    # 07:00 UTC (2 a.m. EST) are both scheduled; the gate job keeps the one matching New York's
    # current offset, even if GitHub starts it late.
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      max:
        description: "Max postings per company (blank = config default)"
        required: false

env:
  DATA_REPO: yimizhao2015/jobmarket-lens-data

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          tz=$(TZ=America/New_York date +%Z)
          if [ "${{ github.event_name }}" != "schedule" ] \
             || { [ "${{ github.event.schedule }}" = "0 6 * * 1" ] && [ "$tz" = "EDT" ]; } \
             || { [ "${{ github.event.schedule }}" = "0 7 * * 1" ] && [ "$tz" = "EST" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore history
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          # Without the private history the run would forget when postings were first seen.
          [ -n "$GH_TOKEN" ] || { echo "::error::DATA_REPO_TOKEN secret is not set"; exit 1; }
          if ! gh release download data -R "$DATA_REPO" -p lens.db.gz -D data; then
            # First run: start from the seed history committed to the data repo in parts.
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${DATA_REPO}" seed-repo
            cat seed-repo/seed/lens.db.gz.part-* > data/lens.db.gz
            rm -rf seed-repo
          fi
          gunzip -f data/lens.db.gz
      - name: Collect
        run: python -m collector.run ${{ github.event.inputs.max && format('--max {0}', github.event.inputs.max) || '' }}
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Save history
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          gzip -kf data/lens.db data/normalized/postings.csv
          gh release view data -R "$DATA_REPO" >/dev/null 2>&1 || gh release create data -R "$DATA_REPO" --title "Posting history" --notes "SQLite history (lens.db.gz) and normalized postings (postings.csv.gz) for JobMarket Lens. Replaced on every weekly run."
          gh release upload data -R "$DATA_REPO" data/lens.db.gz data/normalized/postings.csv.gz --clobber
      - name: Commit dashboard
        run: |
          git config user.name "jobmarket-lens bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/index.html config/ "data/data source.csv" "data/Job postings.csv"
          git commit -m "Data refresh $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase -X theirs origin main
          git push
