# The dashboard is hosted on Vercel (www.jobmarketlens.com). GitHub Pages only serves pages/, a redirect there.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["pages/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
